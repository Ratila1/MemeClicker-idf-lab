spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    security:
      protocol: SSL
    ssl:
      bundle: aiven
  ssl:
    bundle:
      pem:
        aiven:
          truststore:
            certificate: file:/etc/secrets/ca.pem
          keystore:
            certificate: file:/etc/secrets/service.cert
            private-key: file:/etc/secrets/service.key
  data:
    redis:
      url: ${REDIS_URL}
# На Aiven топики clicks и clicks.dlq (1 партиция) создаются вручную в консоли
clicker:
  create-topics: false