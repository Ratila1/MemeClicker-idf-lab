spring:
  application:
    name: backend
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        linger.ms: 1
    consumer:
      group-id: clicker
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
    listener:
      ack-mode: manual

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info