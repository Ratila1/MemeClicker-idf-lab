services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clicker-app

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: "8080"

      # Внешняя Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS}"
      SPRING_KAFKA_SECURITY_PROTOCOL: SSL
      SPRING_KAFKA_SSL_BUNDLE: aiven

      # Сертификаты для Kafka
      SPRING_SSL_BUNDLE_PEM_AIVEN_TRUSTSTORE_CERTIFICATE: "file:/etc/secrets/ca.pem"
      SPRING_SSL_BUNDLE_PEM_AIVEN_KEYSTORE_CERTIFICATE: "file:/etc/secrets/service.cert"
      SPRING_SSL_BUNDLE_PEM_AIVEN_KEYSTORE_PRIVATE_KEY: "file:/etc/secrets/service.key"

      # Внешний Redis
      SPRING_DATA_REDIS_URL: "${REDIS_URL:?Set REDIS_URL}"

      # Топики создаются вручную в Aiven
      CLICKER_CREATE_TOPICS: "false"

    volumes:
      - type: bind
        source: ./secrets
        target: /etc/secrets
        read_only: true
        bind:
          create_host_path: false

    stop_grace_period: 40s